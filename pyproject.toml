[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labcraft"
version = "0.0.1"
description = "Thermodynamic simulation engine for multiplex primer panel design (LAMP & PCR)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "LabCraft Contributors"}
]
keywords = ["LAMP", "PCR", "multiplex", "thermodynamics", "primer", "diagnostics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "primer3-py>=2.0",
    "biopython>=1.80",
    "ViennaRNA>=2.6",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "regex>=2023.0",
]

[project.optional-dependencies]
validation = ["nupack>=4.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mpmath>=1.3",
]

[project.scripts]
labcraft = "labcraft.cli.main:app"

[project.urls]
Homepage = "https://github.com/Cheikht4/Labcraft"
Documentation = "https://github.com/Cheikht4/Labcraft"
Repository = "https://github.com/Cheikht4/Labcraft"
Issues = "https://github.com/Cheikht4/Labcraft/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/labcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nupack: tests requiring NUPACK (deselect with '-m not nupack')",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict = true
mypy_path = "src"
