name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          
      - name: Install dependencies
        # TODO: Full dependencies when CI runners verified
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Run Ruff
        run: ruff check .
        
      - name: Run mypy
        run: mypy src/labcraft
        
      - name: Run pytest
        run: pytest --maxfail=1 --cov=labcraft --cov-report=xml tests/
