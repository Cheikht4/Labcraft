name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          
      - name: Install dependencies
        # TODO: Full dependencies when CI runners verified
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Run Ruff
        run: ruff check .
        
      - name: Run mypy
        continue-on-error: true
        run: mypy src/labcraft
        
      - name: Verify validation scripts syntax
        run: python -m py_compile validation/*.py
        
      - name: Run pytest
        run: |
          set -o pipefail
          pytest --maxfail=1 --tb=short --cov=labcraft --cov-report=xml tests/ 2>&1 | tee "${{ runner.temp }}/pytest_out.txt" || {
            python -c 'import os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pytest_out.txt"; lines=p.read_text(encoding="utf-8", errors="replace").splitlines()[-35:]; print("::error title=pytest failure::" + " | ".join(lines))'
            exit 1
          }

      - name: Run pytest from another directory
        run: |
          set -o pipefail
          mkdir -p "${{ runner.temp }}/test_dir"
          cd "${{ runner.temp }}/test_dir"
          pytest --maxfail=1 --tb=short "$GITHUB_WORKSPACE/tests/" 2>&1 | tee "${{ runner.temp }}/pytest_ext.txt" || {
            python -c 'import os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pytest_ext.txt"; lines=p.read_text(encoding="utf-8", errors="replace").splitlines()[-35:]; print("::error title=pytest ext failure::" + " | ".join(lines))'
            exit 1
          }
