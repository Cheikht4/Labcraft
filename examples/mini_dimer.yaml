experiment:
  name: "Mini Panel Dimer"
  chemistry: LAMP
  temperature_C: 65.0
  enzyme: Bst2.0_WarmStart
  buffer:
    na_mM: 50.0
    k_mM: 10.0
    tris_mM: 20.0
    mg_mM: 8.0
    dntp_mM: 1.4

targets:
  - id: TargetX
    sequence_file: examples/synth_target_b.fasta
    copies_per_uL: 1000.0

primer_sets:
  - target: TargetX
    primers:
      F3:
        seq: "GATCGATCGGCCTTAAAAA"
        conc_uM: 0.2
      B3:
        seq: "TTTTTTTTAAGGCC"
        conc_uM: 0.2
