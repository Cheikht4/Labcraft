experiment:
  name: "Synthetic 2-Plex LAMP Panel (Test)"
  chemistry: LAMP
  temperature_C: 65.0
  enzyme: Bst2.0_WarmStart
  buffer:
    na_mM: 50.0
    k_mM: 10.0
    tris_mM: 20.0
    mg_mM: 8.0
    dntp_mM: 1.4

targets:
  - id: SynthA
    sequence_file: examples/synth_target_a.fasta
    copies_per_uL: 1000.0
  - id: SynthB
    sequence_file: examples/synth_target_b.fasta
    copies_per_uL: 1000.0

primer_sets:
  - target: SynthA
    primers:
      F3:
        seq: "GCTAGCAATCGTACGCATAG"
        conc_uM: 0.2
      B3:
        seq: "TGACCTTAGGCATTCGAACT"
        conc_uM: 0.2
      FIP:
        seq: "ATCGATCGATCGATCGATCGTTTTCAGTACGCATAGCTAGCTAG"
        conc_uM: 1.6
        domains:
          F1c: "ATCGATCGATCGATCGATCG"
          linker: "TTTT"
          F2: "CAGTACGCATAGCTAGCTAG"
      BIP:
        seq: "TTGCAATGCAATGCAATGCATTTTGACCTTAGGCATTCGAACT"
        conc_uM: 1.6
      LF:
        seq: "ACGTACGTACGTACGTACGT"
        conc_uM: 0.8
      LB:
        seq: "TGCATGCATGCATGCATGCA"
        conc_uM: 0.8

  - target: SynthB
    primers:
      F3:
        seq: "ATGCATGCATGCATGCATGC"
        conc_uM: 0.2
      B3:
        seq: "GCATGCATGCATGCATGCAT"
        conc_uM: 0.2
      FIP:
        seq: "TACCGATCGATCGATCGATCTTTTACGTACGTACGTACGATCG"
        conc_uM: 1.6
        domains:
          F1c: "TACCGATCGATCGATCGATC"
          linker: "TTTT"
          F2: "ACGTACGTACGTACGATCG"
      BIP:
        seq: "GATCGATCGATCGATCGATCTTTTCTAGCTGCATGCATGATCG"
        conc_uM: 1.6
      LF:
        seq: "CATGCATGCATGCATGCATG"
        conc_uM: 0.4
      LB:
        seq: "GTACGTACGTACGTACGTAC"
        conc_uM: 0.4
